<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/books.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        
        <nav>
            <a href="index.html">Home</a>
            <a href="books.html">Books</a>

            <a href="contact.html">Contact</a>

            <a href="login.html">Login</a>
        </nav>
        <div class="title">
            <h1><a href="index.html">📚 BookHive</a></h1>
            <img src="./images/pexels-cottonbro-6266098.jpg" alt="">
        </div>
    </header>

    <main>
        <section class="page-header">
            <h2>Sign Up</h2>
            <p>Create your BookHive account to save books and orders.</p>
        </section>

        <section class="form-section">
            <form class="auth-form">
                <label>Name</label>
                <input type="text" placeholder="Your name">
                <label>Email</label>
                <input type="email" placeholder="Your email">
                <label>Password</label>
                <input type="password" placeholder="Create a password">
                <button type="submit" class="button">Sign Up</button>
            </form>
            <p class="form-note">Already have an account? <a href="login.html">Login</a></p>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-column">
                <h4>📚 BookHive</h4>
                <p>India's favorite online bookstore.</p>
            </div>
            <div class="footer-column">
                <h4>Quick Links</h4>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="books.html">All Books</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>

        </div>
        <div class="footer-bottom">
            <p>© 2026 BookHive. All rights reserved.</p>
        </div>
